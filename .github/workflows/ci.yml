name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m compileall -q src deploy/*.py tests
      - run: bash -n deploy/*.sh
      - run: pytest --cov=pokehunter --cov-report=term-missing --cov-fail-under=80
