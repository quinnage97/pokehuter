name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src deploy/*.py tests
      - run: bash -n deploy/*.sh
      - run: shellcheck deploy/*.sh
      - run: pytest -W error --cov=pokehunter --cov-report=term-missing --cov-fail-under=80
      - name: Verify production dependency constraints
        run: |
          python -m venv "$RUNNER_TEMP/pokehunter-prod"
          PIP_CONSTRAINT="$GITHUB_WORKSPACE/deploy/constraints.txt" \
            "$RUNNER_TEMP/pokehunter-prod/bin/pip" install \
            --constraint "$GITHUB_WORKSPACE/deploy/constraints.txt" .
          "$RUNNER_TEMP/pokehunter-prod/bin/pip" check
