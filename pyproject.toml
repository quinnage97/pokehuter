[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pokehunter"
version = "0.1.0"
description = "Automated eBay bargain discovery for English Charizard and Mew cards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
pokehunter = "pokehunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokehunter"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
